name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Без этого каждый CI-билд подписывается НОВЫМ debug-ключом, и новый APK
      # не может обновить ранее установленный («Приложение не установлено»).
      # Кэшируем debug.keystore — все сборки будут подписаны одним ключом.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install
          # Обновляем глобальные бандлы плагинов в www/vendor/ под установленные версии
          node tools/sync-vendor.js
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: asutp-timer-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false

