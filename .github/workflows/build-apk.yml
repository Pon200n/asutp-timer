name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Без этого каждый CI-билд подписывается НОВЫМ debug-ключом, и новый APK
      # не может обновить ранее установленный (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # Кэшируем debug.keystore — все сборки будут подписаны одним ключом.
      # ВАЖНО: actions/cache@v4 в этой генерации отключён (сборки шли с разными
      # ключами), актуальная ветка — v6.
      - name: Cache debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install
          # Обновляем глобальные бандлы плагинов в www/vendor/ под установленные версии
          node tools/sync-vendor.js
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Свойства собранного APK: подпись, манифест, целостность архива.
      # Отчёт уходит в лог сборки и в ветку build-info (её можно читать без авторизации).
      - name: APK diagnostics
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-info
          {
            echo "### Файл"
            ls -la "$APK"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "байт:   $(stat -c%s "$APK")"
            echo
            echo "### Целостность архива"
            unzip -t "$APK" | tail -3
            echo
            echo "### Подпись"
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -20
            else
              echo "apksigner не найден"
            fi
            echo
            echo "### badging (пакет, версии, разрешения)"
            AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" 2>&1 | head -40
            else
              echo "aapt не найден"
            fi
            echo
            echo "### Веб-ресурсы и звуки внутри APK"
            unzip -l "$APK" | grep -E "assets/public/(index|js/|vendor/)|res/raw" | head -40
            echo
            echo "### Итоговый (merged) AndroidManifest.xml"
            MF=$(find android/app/build -name AndroidManifest.xml -path "*merged*" | head -1)
            if [ -n "$MF" ]; then
              echo "# $MF"
              cat "$MF"
            else
              echo "merged manifest не найден"
            fi
          } > apk-info/apk-diagnostics.txt 2>&1
          cat apk-info/apk-diagnostics.txt

      # Скользящий релиз с APK: файл скачивается без авторизации, поэтому его
      # можно сразу ставить на телефон через adb — без облачной проверки MIUI.
      # Идёт ДО публикации отчёта: лог работы попадёт в apk-info/ и его будет видно.
      - name: Publish rolling release with APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node tools/publish-release.js

      # Отчёт публикуется обновлением файла через API — без переписывания
      # истории ветки build-info (обычный push не пройдёт: файл меняется каждый раз)
      - name: Publish diagnostics to build-info branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/apk-info/apk-diagnostics.txt?ref=build-info" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch(e){console.log('')}})")
          if [ -z "$SHA" ]; then
            echo "Файл отчёта на build-info не найден — публикация пропущена"
            exit 0
          fi
          CONTENT=$(base64 -w0 apk-info/apk-diagnostics.txt)
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/contents/apk-info/apk-diagnostics.txt" \
            -d "{\"message\":\"APK diagnostics\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\",\"branch\":\"build-info\"}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(j.commit?('отчёт обновлён: '+j.commit.html_url):('ошибка: '+JSON.stringify(j).slice(0,200)))})"

          # лог публикации релиза — отдельным файлом, чтобы видеть причину сбоя
          if [ -f apk-info/release-publish.log ]; then
            LSHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/contents/apk-info/release-publish.log?ref=build-info" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch(e){console.log('')}})")
            if [ -n "$LSHA" ]; then
              LCONTENT=$(base64 -w0 apk-info/release-publish.log)
              curl -sS -X PUT \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/contents/apk-info/release-publish.log" \
                -d "{\"message\":\"release publish log\",\"content\":\"$LCONTENT\",\"sha\":\"$LSHA\",\"branch\":\"build-info\"}" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log(j.commit?'лог релиза обновлён':'лог релиза: ошибка '+JSON.stringify(j).slice(0,150))})"
            fi
          fi

      # Артефакт отдаём обычным ZIP-архивом: внутри — app-debug.apk.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: asutp-timer-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: true
