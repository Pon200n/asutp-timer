apply plugin: 'com.android.application'

// Идентификатор сборки: номер прогона CI, короткий sha и время сборки.
// Они попадают в APK, и приложение показывает их — чтобы всегда было видно,
// какая именно сборка стоит на телефоне. Номер прогона совпадает с тем,
// что GitHub показывает в Actions («Build Android APK #48»).
def buildNumberEnv = System.getenv("BUILD_NUMBER")
def buildNumber = (buildNumberEnv && buildNumberEnv.isInteger()) ? buildNumberEnv.toInteger() : 0
def gitSha = (System.getenv("GIT_SHA") ?: "local").trim()
def buildTime = (System.getenv("BUILD_TIME") ?: "").trim()
def shortSha = gitSha.length() > 7 ? gitSha.substring(0, 7) : gitSha
def versionSuffix = buildNumber > 0 ? buildNumber.toString() : "dev"

android {
    namespace = "com.asutp.timer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.asutp.timer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode ПОСТОЯННЫЙ: номер сборки живёт в versionName.
        // Так эталонный APK можно поставить ПОВЕРХ любой новой сборки —
        // установка той же версии разрешена системой, а понижение версии
        // (versionCode меньше установленного) блокируется. Это и есть
        // возможность откатиться на стабильную сборку прямо с телефона.
        versionCode 66
        versionName "1.0." + versionSuffix
        buildConfigField "String", "GIT_SHA", "\"${shortSha}\""
        buildConfigField "String", "BUILD_NUMBER", "\"${buildNumber}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Постоянный отладочный ключ подписи: все сборки подписываются им,
    // поэтому обновление поверх работает (adb install -r), а разрешения
    // и настройки приложения не слетают при переустановке.
    signingConfigs {
        debug {
            storeFile file("../../keystore/debug.p12")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    // AGP 8 не генерирует BuildConfig по умолчанию, а именно туда кладутся
    // номер сборки, sha и время сборки (их показывает приложение).
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
